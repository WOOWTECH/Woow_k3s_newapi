# -----------------------------------------------------------------------------
# Secret for Woow_k3s_newapi - PLACEHOLDERS ONLY. Never commit real values.
#
# Used with the default secrets.create=false: the chart only references this
# Secret by name. Copy this file OUTSIDE the repo, replace REPLACE_ME_PG_PASSWORD
# in BOTH keys below (they must match), then apply that copy:
#   kubectl --context woow-k3s apply -f /secure/path/new-api-secret.yaml
#
# Generate the password with `openssl rand -hex 24` (letters/digits only). A
# password from `openssl rand -base64` can contain "/", which breaks SQL_DSN's
# postgres://user:PASSWORD@host/db URL parsing about 4 times in 10.
# -----------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: new-api-secret
  namespace: new-api
  labels:
    app: new-api
type: Opaque
stringData:
  POSTGRES_PASSWORD: "REPLACE_ME_PG_PASSWORD"
  SQL_DSN: "postgres://newapi:REPLACE_ME_PG_PASSWORD@postgres:5432/newapi"
  # Redis has no password (see README "Design decisions").
  REDIS_CONN_STRING: "redis://redis:6379"
