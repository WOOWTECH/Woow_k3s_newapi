# pytest config for the NA-03 contract suite (tests/contract).
# CI does not run pytest: it runs the offline self-check with plain python3
# (.gitea/workflows/ci.yml). This file is for the stg gate runs
# (docs/OPERATIONS.md 〈升版〉, tests/contract/README.md).
#
# --assert=plain: assertion rewriting would print the values in a failed
# assert (a token, a key); conftest.py refuses any other mode and -l/--showlocals.
[pytest]
testpaths = tests/contract
python_files = test_*.py
addopts = -ra --assert=plain -p no:cacheprovider
markers =
    contract_id(id): the C/F/X id this test pins
    offline: runs without any cluster (CI)
    slow: long waits; skipped with NEWAPI_CONTRACT_SKIP_SLOW=1
    disruptive: touches shared stg state; needs NEWAPI_CONTRACT_DISRUPTIVE=1, runs last
    ct_exhaust: C23's 429 run, alone with NEWAPI_CONTRACT_CT_EXHAUST=1
    upstream_down: X06 connect run, alone with NEWAPI_CONTRACT_UPSTREAM_DOWN=1
    run_last: ordered after everything else
