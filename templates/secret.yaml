{{- /*
Secret, rendered only with secrets.create=true. By default it is created out
of band from examples/secrets.example.yaml and the chart never touches it, so
an upgrade cannot overwrite a real password.
SQL_DSN and REDIS_CONN_STRING are computed here, not taken from values: there
is exactly one password to manage (postgresPassword), not two kept in sync by
hand. The password is run through urlquery so it can never break the DSN
(README recommends a hex password, which passes through unquoted anyway).
*/ -}}
{{- if .Values.secrets.create }}
{{- $pw := required "secrets.postgresPassword is required when secrets.create=true" .Values.secrets.postgresPassword }}
---
apiVersion: v1
kind: Secret
metadata:
  name: new-api-secret
  namespace: {{ include "newapi.ns" . }}
  labels:
    app: new-api
  {{- include "newapi.keepAnnotations" . | nindent 2 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ $pw | quote }}
  SQL_DSN: {{ printf "postgres://%s:%s@postgres:5432/%s" .Values.config.POSTGRES_USER ($pw | urlquery) .Values.config.POSTGRES_DB | quote }}
  # Redis has no password (see values.yaml / README); kept in the Secret only
  # for symmetry with how new-api reads its connection strings.
  REDIS_CONN_STRING: "redis://redis:6379"
{{- end }}
