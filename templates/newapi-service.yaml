---
apiVersion: v1
kind: Service
metadata:
  name: new-api
  namespace: {{ .Values.namespace.name }}
  labels:
    app: new-api
    component: new-api
spec:
  type: {{ .Values.newapi.service.type }}
  selector:
    app: new-api
    component: new-api
  ports:
    - port: {{ .Values.newapi.service.port }}
      targetPort: {{ .Values.newapi.service.port }}
      protocol: TCP
      name: http
      {{- if eq .Values.newapi.service.type "NodePort" }}
      nodePort: {{ .Values.newapi.service.nodePort }}
      {{- end }}
