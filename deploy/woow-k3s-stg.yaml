# Staging values for woow-k3s (release newapi, namespace new-api-stg).
# Used by the PaaS "AI 模型" tab on staging. The connector attaches to the
# dormant staging tunnel, whose remote ingress is only http_status:404. No
# origin route or DNS is added here. Do not publish the hostname until the
# NA-06 Access and WAF gates are verified.
#   helm upgrade --install newapi ./chart -n new-api-stg --create-namespace -f deploy/woow-k3s-stg.yaml
publicUrl: https://newapi-stg.woowtech.io

cloudflared:
  enabled: true

postgres:
  size: 5Gi

backup:
  schedule: "45 3 * * *"
  suspend: false
  size: 5Gi
  keepDays: 7

newapi:
  resources:
    requests:
      cpu: 100m
      memory: 192Mi
    limits:
      cpu: "1"
      memory: 768Mi

networkPolicy:
  upstreams:
    # Same LiteLLM as production (svc203), through a separate small-budget key.
    - name: litellm-svc203
      namespace: paas-ws-32e92be2
      podLabels:
        app.kubernetes.io/instance: svc-a8389061
        app.kubernetes.io/name: litellm
        app.kubernetes.io/component: app
      port: 4000

# newapi-proxy for the stg sandboxes (AI-models design §1.4.1; LLM-01a).
proxy:
  enabled: true
  image:
    # Match the already-running staging Helm release and Deployment (read-only
    # checked 2026-10-21). Source commit 3947d2b0 adds call deadlines and
    # circuit-probe recovery; exact image pair passed the 2026-10-19 NA-03
    # staging contract gate in tests/contract/reports/. Previous pins:
    # 9d646e946d56477fcf1ddecb1ca4ce5ba1ce03c9@sha256:d3ab64d43692bb557cadf86c7b340ca2d25cb4e51981c18da298f3aa5839af65 (#1822)
    # 8fa836218e85cda520abacf0ab9e29744761c187@sha256:2e6193f3a4a2b2a3e4a0f60601f77d96fcff73b953336488ce18a3e3f7d49496 (#1792)
    # 59b03479ef833b1b62260692431a03782bb7b47c@sha256:52da4e80eaf4b0cf38ba1b24fb684d37ab627c7d424f9e56fe15dd58a4a856fd (LLM-01a)
    # Change it here, in git — never with helm --set, or the next
    # `helm upgrade -f deploy/woow-k3s-stg.yaml` rolls back to a different image.
    tag: 3947d2b08d0813a2fae9f120e8fa67990f86c4cb
    digest: sha256:0fdf5e12da8c8fec9d4b1650d2a134d6dc58d1ba86b82d54ea62b8b6fb8ce3bd
  # dockerconfigjson for jcr-prod (read), created in new-api-stg at deploy time.
  imagePullSecrets:
    - name: newapi-proxy-registry
  # Sandbox prefixes: "ws" + two lowercase letters + 10 digits (design N14).
  usernameRegex: '^ws[a-z]{2}\d{10}$'
  # Sandbox blocks 1-31 only (198.18.0.0 + 256 + block*4096 + id).
  tenantIpRange: 198.18.17.0-198.19.255.255
  # Expiry of the AP / OP now in Secret newapi-proxy-pats (its
  # woowtech.io/ap-expires-at / op-expires-at annotations, unix seconds; dates
  # are not secret). /readyz reports days left; PaaS alerts at 14 (DESIGN §7.3).
  # Update together with every PAT rotation (docs/OPERATIONS.md).
  apExpiresAt: "1807713552"
  opExpiresAt: "1807713552"
  clients:
    # Odoo pods of dev sandboxes only: not their agent-runtime, nginx or
    # pgadmin pods, nothing in paas-ws-stg-*.
    # 舊 stg 已在 cd#289 PR-4 退役刪除；這一筆保留給其他平台沙盒。
    - name: sandbox-odoo
      namespaceSelector:
        matchLabels:
          dev-sandbox.io/managed: "true"
      podSelector:
        matchLabels:
          app.kubernetes.io/component: odoo
    # stg 平台 Odoo 新 release（paas-app-bundle-cd 的 paas-odoo-platform-stg，woow-odoo chart platform profile；cd#289）。
    # 只選 web 與 cron（component In server, cron）；同 release 的 postgresql、db-backup Job 不選。
    # 形狀同 chart values.yaml 的 prod 範例（paas-odoo），只換 ns 與 instance。
    # web／cron 那一側的 egress 在 paas-app-bundle-cd 的 paas-odoo-platform-stg-guardrails/web-cron-egress-netpol.yaml。
    - name: platform-odoo-stg
      namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: paas-stg-system
      podSelector:
        matchLabels:
          app.kubernetes.io/instance: paas-odoo-platform-stg
        matchExpressions:
          - key: app.kubernetes.io/component
            operator: In
            values: [server, cron]

# NA-07 staging qualification provisions a new PVC while the encrypted
# CronJob remains suspended. Recheck Longhorn capacity before deployment.
# The original daily backup above remains active.
encryptedBackup:
  # Staging qualification: provision only; legacy daily backup stays active.
  enabled: true
  schedule: "45 */6 * * *"
  keepDays: 7
  suspend: true
  pruneEnabled: false
  size: 5Gi
  # Fresh test recipient; private identity stays outside Git and the cluster.
  ageRecipient: age15n5z9tqsltqm202ev2dl24wuk7gh0xczexkaklc9j3dqnxf4cq7qcymlgf
  # Immutable image from successful workflow run 25116; recipe matches main.
  image:
    tag: c9f8416dcefb1b880c1b654b1190c8e989c6b826
    digest: sha256:334f25bfe563aa4142ab2261c06a93110f600c002187478c9992b1dd14b873c5
  imagePullSecrets:
    - name: newapi-proxy-registry
  capacityVerification:
    evidenceRef: docs/NA-07-STG-SUSPENDED-20261022.md
    namespace: new-api-stg
    release: newapi
    storageClassName: longhorn
    requestedSize: 5Gi

retention:
  enabled: true
  suspend: false
