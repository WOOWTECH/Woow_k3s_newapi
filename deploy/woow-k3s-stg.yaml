# Staging values for woow-k3s (release newapi, namespace new-api-stg).
# Used by the PaaS "AI 模型" tab on staging; no public hostname yet
# (cloudflared off), callers reach it in-cluster.
#   helm upgrade --install newapi ./chart -n new-api-stg --create-namespace -f deploy/woow-k3s-stg.yaml
publicUrl: https://newapi-stg.woowtech.io

cloudflared:
  enabled: false

postgres:
  size: 5Gi

backup:
  size: 5Gi
  keepDays: 7

newapi:
  resources:
    requests:
      cpu: 100m
      memory: 192Mi
    limits:
      cpu: "1"
      memory: 768Mi

networkPolicy:
  upstreams:
    # Same LiteLLM as production (svc203), through a separate small-budget key.
    - name: litellm-svc203
      namespace: paas-ws-32e92be2
      podLabels:
        app.kubernetes.io/instance: svc-a8389061
        app.kubernetes.io/name: litellm
        app.kubernetes.io/component: app
      port: 4000

# newapi-proxy for the stg sandboxes (AI-models design §1.4.1; LLM-01a).
proxy:
  enabled: true
  image:
    # Built by woow_paas_platform build-newapi-proxy (workflow_dispatch run
    # 21271) on the LLM-02b feature branch feat/llm-02b-platform-foundation,
    # head 39817d07: adds the read-only route ap.user.list (GET /api/user/,
    # p / page_size / sort_by=id / sort_order) for the PaaS balance refresh.
    # Every LLM-01a route is unchanged. stg pins the feature-branch build for
    # the LLM-02b stg acceptance; once the platform PR merges, re-pin to the
    # develop merge build (same procedure as PR #6). Previous pin, for rollback:
    # 59b03479ef833b1b62260692431a03782bb7b47c@sha256:52da4e80eaf4b0cf38ba1b24fb684d37ab627c7d424f9e56fe15dd58a4a856fd
    # Change it here, in git — never with helm --set, or the next
    # `helm upgrade -f deploy/woow-k3s-stg.yaml` rolls back to a different image.
    tag: 39817d0748f1b6c293c31c4dfe10498e3b5d17a0
    digest: sha256:2e6193f3a4a2b2a3e4a0f60601f77d96fcff73b953336488ce18a3e3f7d49496
  # dockerconfigjson for jcr-prod (read), created in new-api-stg at deploy time.
  imagePullSecrets:
    - name: newapi-proxy-registry
  # Sandbox prefixes: "ws" + two lowercase letters + 10 digits (design N14).
  usernameRegex: '^ws[a-z]{2}\d{10}$'
  # Sandbox blocks 1-31 only (198.18.0.0 + 256 + block*4096 + id).
  tenantIpRange: 198.18.17.0-198.19.255.255
  # Expiry of the AP / OP now in Secret newapi-proxy-pats (its
  # woowtech.io/ap-expires-at / op-expires-at annotations, unix seconds; dates
  # are not secret). /readyz reports days left; PaaS alerts at 14 (DESIGN §7.3).
  # Update together with every PAT rotation (docs/OPERATIONS.md).
  apExpiresAt: "1807713552"
  opExpiresAt: "1807713552"
  clients:
    # Odoo pods of dev sandboxes only: not their agent-runtime, nginx or
    # pgadmin pods, nothing in paas-ws-stg-* or paas-stg-system.
    - name: sandbox-odoo
      namespaceSelector:
        matchLabels:
          dev-sandbox.io/managed: "true"
      podSelector:
        matchLabels:
          app.kubernetes.io/component: odoo
