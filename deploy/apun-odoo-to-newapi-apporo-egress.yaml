# Applied in the Apporo Odoo namespace apun (not part of any Helm release;
# docs/APPORO-K3S.md): lets the apun Odoo web and cron pods reach the Apporo
# newapi-proxy on 8080 (signed proxy) and 8081 (/readyz). apun-odoo's egress is
# limited by allow-odoo-to-mailcow (private ranges blocked, so another namespace is
# unreachable). Egress policies add up: allow-odoo-to-mailcow and
# default-deny-external stay untouched. The other half is proxy.clients in
# deploy/apporo-k3s.yaml (same pod selector; both sides must allow).
#
# Apply only when BOTH hold (docs/APPORO-K3S.md 〈手動套用的物件〉):
# 1. The cron pod's own egress policy, allow-odoo-cron-to-mailcow (the copy of
#    allow-odoo-to-mailcow that selects component cron, owned by the odoo-tenant
#    change), is already applied. A pod selected by any egress policy may only use
#    what the selecting policies allow: this one alone would leave a running cron
#    pod without DNS, DB and mail.
# 2. The apun switch is done and BOTH apun Odoo pods, web and cron, run with the
#    four WOOW_LLM_EXTRA_* variables (step 9 of Woow_k3s_odoo
#    deploy/woow-k3s/planned/apun/cron-split.yaml, after its step 8 checks).
#    Those make the platform's MCP URL guard treat new-api-apporo as protected:
#    no apun pod without them may reach the proxy.
# On rollback of the apun switch, delete this policy first.
#   kubectl apply -f deploy/apun-odoo-to-newapi-apporo-egress.yaml
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: apun-odoo-to-newapi-apporo-egress
  namespace: apun
  labels:
    app.kubernetes.io/part-of: woow-k3s-newapi
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: apun
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values: [application, cron]
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: new-api-apporo
          podSelector:
            matchLabels:
              app.kubernetes.io/name: newapi
              app.kubernetes.io/instance: newapi
              app.kubernetes.io/component: proxy
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 8081
