# Production values for woow-k3s (release newapi, namespace new-api).
#   helm upgrade --install newapi ./chart -n new-api --create-namespace -f deploy/woow-k3s.yaml
publicUrl: https://newapi.woowtech.io

networkPolicy:
  upstreams:
    # WoowTech's own LiteLLM in the PaaS (workspace 37, service 203).
    # Its namespace carries the matching ingress allow
    # (deploy/litellm-from-newapi-ingress.yaml).
    - name: litellm-svc203
      namespace: paas-ws-32e92be2
      podLabels:
        app.kubernetes.io/instance: svc-a8389061
        app.kubernetes.io/name: litellm
        app.kubernetes.io/component: app
      port: 4000

backup:
  schedule: "45 3 * * *"
  keepDays: 7
  suspend: false

# NA-07 stg-first rollout; original daily backup above remains active.
encryptedBackup:
  enabled: false
  schedule: "45 */6 * * *"
  keepDays: 7
  suspend: true
  pruneEnabled: false

retention:
  enabled: true
  suspend: false

# NA-05 preparation only: no proxy workloads/NetworkPolicies/Valkey ACL yet.
# Do not copy the scratch enabled candidate into this file. Activation is a
# separate reviewed PR after owner Secrets/identity/expiry and contract gates.
proxy:
  enabled: true
  replicas: 2
  image:
    tag: 3947d2b08d0813a2fae9f120e8fa67990f86c4cb
    digest: sha256:0fdf5e12da8c8fec9d4b1650d2a134d6dc58d1ba86b82d54ea62b8b6fb8ce3bd
  imagePullSecrets:
    - name: newapi-proxy-registry
  patsSecret: newapi-proxy-pats
  hmacSecret: newapi-proxy-hmac
  usernameRegex: '^wp\d{10}$'
  tenantIpRange: 198.18.1.0-198.19.255.255
  apExpiresAt: "1808450171"
  opExpiresAt: "1808450171"
  clients:
    - name: paas-odoo
      namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: paas-system
      podSelector:
        matchLabels:
          app.kubernetes.io/instance: paas-odoo-platform
        matchExpressions:
          - key: app.kubernetes.io/component
            operator: In
            values: [server, cron]
