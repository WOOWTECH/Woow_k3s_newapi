name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the contract gate compares the image pins with the base

      - name: Install helm
        run: |
          set -euo pipefail
          v=v3.19.0
          curl -fsSL "https://get.helm.sh/helm-$v-linux-amd64.tar.gz" | tar -xz -C /tmp
          sudo mv /tmp/linux-amd64/helm /usr/local/bin/helm || mv /tmp/linux-amd64/helm /usr/local/bin/helm
          helm version

      # newapi-proxy digest placeholder: a hard failure, not a warning. The
      # chart refuses it too (templates/proxy.yaml); this says why up front.
      # The real <sha> + digest from build-newapi-proxy must be committed
      # before the PR can go green (never patched in with helm --set).
      - name: No placeholder image digests
        run: |
          set -euo pipefail
          if grep -nE 'digest: *"?sha256:0{64}"?' deploy/*.yaml; then
            echo "::error::deploy values still hold the all-zero placeholder digest: dispatch build-newapi-proxy and commit the tag + digest it printed"
            exit 1
          fi

      - name: Lint and render
        run: |
          set -euo pipefail
          helm lint ./chart
          helm lint ./chart -f deploy/woow-k3s.yaml
          helm lint ./chart -f deploy/woow-k3s-stg.yaml
          helm template newapi ./chart -n new-api -f deploy/woow-k3s.yaml > /tmp/rendered.yaml
          helm template newapi ./chart -n new-api-stg -f deploy/woow-k3s-stg.yaml > /tmp/rendered-stg.yaml
          grep -c '^kind:' /tmp/rendered.yaml /tmp/rendered-stg.yaml

      - name: Images are pinned by digest
        run: |
          set -euo pipefail
          for f in /tmp/rendered.yaml /tmp/rendered-stg.yaml; do
            bad=$(grep -E '^\s+image: ' "$f" | grep -v '@sha256:' || true)
            if [ -n "$bad" ]; then echo "unpinned images in $f:"; echo "$bad"; exit 1; fi
          done

      # newapi-proxy (templates/proxy.yaml): off in prod until NA-05, on in stg.
      - name: newapi-proxy component
        run: |
          set -euo pipefail
          if grep -q '^  name: newapi-proxy$' /tmp/rendered.yaml; then
            echo "newapi-proxy must stay disabled in deploy/woow-k3s.yaml for now"; exit 1
          fi
          for kind in ConfigMap Service Deployment PodDisruptionBudget NetworkPolicy; do
            awk -v k="$kind" '$0=="kind: "k{f=1} f&&/^  name: newapi-proxy$/{found=1} /^---/{f=0} END{exit !found}' \
              /tmp/rendered-stg.yaml || { echo "stg render lacks the newapi-proxy $kind"; exit 1; }
          done
          if grep -q 'newapi-proxy[^@]*@sha256:0\{64\}' /tmp/rendered-stg.yaml; then
            echo "::error::rendered stg values carry the placeholder proxy digest"; exit 1
          fi

      # The chart's fail() guards (digest, client selectors, username regex):
      # unsafe values must keep failing, the real shapes must keep rendering.
      - name: newapi-proxy chart guards
        run: scripts/chart-guards.sh

      - name: Scripts parse
        run: |
          set -euo pipefail
          for f in scripts/*.sh; do bash -n "$f"; done
          for f in scripts/*.py scripts/tests/*.py tests/contract/*.py; do python3 -m py_compile "$f"; done
          for f in deploy/settings*.json deploy/pricing/*.json tests/contract/fixtures/*.json; do python3 -c 'import json, sys; json.load(open(sys.argv[1]))' "$f"; done

      # newapi_admin.py against an in-process fake new-api (no network).
      - name: Admin tool unit tests
        run: python3 -m unittest discover -s scripts/tests -v

      # The settings files and the channel spec must keep the invariants the
      # PaaS depends on (scripts/newapi_admin.py INVARIANTS; DESIGN §7.1 I8),
      # paid channels serve only priced models, and chart/values.yaml
      # newapi.image.tag must equal INVARIANTS_FOR_VERSION: an upgrade PR that
      # skips the invariant review (docs/OPERATIONS.md 〈升版〉) fails here.
      - name: Settings keep the PaaS invariants and the version pin
        run: |
          set -euo pipefail
          python3 scripts/newapi_admin.py verify-settings --offline deploy/settings.json
          python3 scripts/newapi_admin.py verify-settings --offline deploy/settings.json deploy/settings-stg.json

      # NA-03 contract suite: CI cannot reach new-api-stg, so it runs the
      # offline self-check (stdlib, no pytest): the signing golden vector, the
      # scrubber plus the acceptance-5 grep over every committed fixture (and
      # their proxy reason codes), every id C01-C27/F01-F12/X01-X09 pinned by a
      # marked test, the budget / settings-guard / report logic, and any
      # committed gate report.
      - name: Contract suite self-check (offline)
        run: python3 tests/contract/selfcheck.py

      # The upgrade gate itself: a PR that changes chart/values.yaml
      # newapi.image or a deploy/woow-k3s*.yaml proxy.image must commit the
      # green stg report for exactly those digests
      # (tests/contract/reports/<tag>_<sha>.json; docs/OPERATIONS.md 〈升版〉).
      - name: Contract gate (image bump needs a green stg report)
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags origin "${{ github.base_ref }}"
            base="origin/${{ github.base_ref }}"
          else
            base="HEAD~1"
          fi
          python3 tests/contract/gate_check.py --base-ref "$base"
