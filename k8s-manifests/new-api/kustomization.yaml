apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: new-api

labels:
  - pairs:
      app: new-api
    includeSelectors: true

resources:
  - namespace.yaml
  - secret.yaml
  - configmap.yaml
  - pvc.yaml
  - postgres-statefulset.yaml
  - postgres-service.yaml
  - redis-deployment.yaml
  - redis-service.yaml
  - new-api-deployment.yaml
  - new-api-service.yaml
