apiVersion: v1
kind: Service
metadata:
  name: {{ include "newapi.fullname" . }}-valkey
  labels:
    {{- include "newapi.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "newapi.selector" (list . "valkey") | nindent 4 }}
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
# new-api's token-bucket limiter (common/limiter, used for per-group request
# caps such as the free trial's 10 per minute) does SCRIPT LOAD once per
# process and then only EVALSHA. A Valkey restart empties the script cache,
# so every capped request fails with NOSCRIPT (500 rate_limit_check_failed)
# until new-api itself restarts. Loading the identical script after every
# Valkey start restores the SHA new-api already holds (NA-03 F11).
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "newapi.fullname" . }}-valkey-scripts
  labels:
    {{- include "newapi.labels" . | nindent 4 }}
binaryData:
  rate_limit.lua: {{ .Files.Get "files/newapi-rate-limit.lua" | b64enc }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "newapi.fullname" . }}-valkey
  labels:
    {{- include "newapi.labels" . | nindent 4 }}
    app.kubernetes.io/component: valkey
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "newapi.selector" (list . "valkey") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "newapi.labels" . | nindent 8 }}
        app.kubernetes.io/component: valkey
      annotations:
        checksum/valkey-scripts: {{ .Files.Get "files/newapi-rate-limit.lua" | sha256sum }}
    spec:
      automountServiceAccountToken: false
      {{- include "newapi.affinity" . | nindent 6 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 1000
        {{- include "newapi.podSecurity" . | nindent 8 }}
      containers:
        - name: valkey
          image: {{ include "newapi.image" .Values.valkey.image }}
          imagePullPolicy: IfNotPresent
          command: ["valkey-server"]
          args:
            - --requirepass
            - $(REDIS_PASSWORD)
            - --save
            - ""
            - --appendonly
            - "no"
            - --maxmemory
            - {{ .Values.valkey.maxmemory | quote }}
            - --maxmemory-policy
            - volatile-lru
            - --dir
            - /data
            {{- if .Values.proxy.enabled }}
            # newapi-proxy's replay record (templates/proxy.yaml): its own ACL
            # user that may only SET keys under newapi-proxy:replay:* and PING;
            # it can neither read nor change new-api's sessions, caches or
            # rate-limit counters. new-api keeps the default user (requirepass).
            # Turning the proxy on or off changes these args: Valkey restarts
            # once (Recreate; cache only, the DB is authoritative).
            - --user
            - newapi-proxy
            - "on"
            - ">$(PROXY_VALKEY_PASSWORD)"
            - resetkeys
            - "~newapi-proxy:replay:*"
            - resetchannels
            - -@all
            - +set
            - +ping
            {{- end }}
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "newapi.secretName" . }}
                  key: REDIS_PASSWORD
            - name: REDISCLI_AUTH
              valueFrom:
                secretKeyRef:
                  name: {{ include "newapi.secretName" . }}
                  key: REDIS_PASSWORD
            {{- if .Values.proxy.enabled }}
            - name: PROXY_VALKEY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "newapi.secretName" . }}
                  key: PROXY_VALKEY_PASSWORD
            {{- end }}
          ports:
            - name: redis
              containerPort: 6379
          lifecycle:
            postStart:
              exec:
                # Best effort, never fails the container: wait for Valkey,
                # load the script, log a SHA mismatch (CI pins the file).
                command:
                  - sh
                  - -c
                  - |
                    i=0
                    until valkey-cli ping >/dev/null 2>&1; do
                      i=$((i+1)); [ "$i" -ge 120 ] && { echo "postStart: valkey not up, script not loaded" >&2; exit 0; }
                      sleep 0.5
                    done
                    sha=$(valkey-cli -x SCRIPT LOAD < /scripts/rate_limit.lua 2>&1)
                    [ "$sha" = {{ .Values.valkey.rateLimitScriptSha1 | quote }} ] || echo "postStart: rate limit script SHA $sha, expected {{ .Values.valkey.rateLimitScriptSha1 }}" >&2
                    exit 0
          readinessProbe:
            exec:
              command: ["valkey-cli", "ping"]
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 15
            periodSeconds: 20
          securityContext:
            {{- include "newapi.containerSecurity" . | nindent 12 }}
          resources:
            {{- toYaml .Values.valkey.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: scripts
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: data
          emptyDir: {}
        - name: scripts
          configMap:
            name: {{ include "newapi.fullname" . }}-valkey-scripts
