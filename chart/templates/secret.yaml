{{- /*
Generated once, kept forever. Rotating SESSION_SECRET logs everyone out;
rotating POSTGRES_PASSWORD needs ALTER USER first (docs/OPERATIONS.md).
*/ -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace (include "newapi.secretName" .) -}}
{{- $d := dict -}}
{{- if $existing -}}{{- $d = $existing.data -}}{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "newapi.secretName" . }}
  labels:
    {{- include "newapi.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  SESSION_SECRET: {{ index $d "SESSION_SECRET" | default (randAlphaNum 64 | b64enc) }}
  CRYPTO_SECRET: {{ index $d "CRYPTO_SECRET" | default (randAlphaNum 64 | b64enc) }}
  POSTGRES_PASSWORD: {{ index $d "POSTGRES_PASSWORD" | default (randAlphaNum 40 | b64enc) }}
  REDIS_PASSWORD: {{ index $d "REDIS_PASSWORD" | default (randAlphaNum 40 | b64enc) }}
  {{- if .Values.proxy.enabled }}
  # newapi-proxy's Valkey ACL user (templates/valkey.yaml, templates/proxy.yaml).
  PROXY_VALKEY_PASSWORD: {{ index $d "PROXY_VALKEY_PASSWORD" | default (randAlphaNum 40 | b64enc) }}
  {{- end }}
