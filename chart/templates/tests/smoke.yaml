{{- if .Values.tests.enabled }}
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "newapi.fullname" . }}-smoke
  labels:
    {{- include "newapi.labels" . | nindent 4 }}
    app.kubernetes.io/component: test
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  enableServiceLinks: false
  {{- include "newapi.affinity" . | nindent 2 }}
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    {{- include "newapi.podSecurity" . | nindent 4 }}
  containers:
    - name: smoke
      # Reuse the app image (has wget) so the test pulls nothing new.
      image: {{ include "newapi.image" .Values.newapi.image }}
      command:
        - sh
        - -c
        - |
          set -eu
          # Retry: NetworkPolicy allow rules for a new pod take a few seconds.
          ok=0
          for i in $(seq 1 30); do
            if out=$(wget -qO- http://{{ include "newapi.fullname" . }}:3000/api/status); then
              echo "$out" | grep -q '"success":true' && { echo "status ok"; ok=1; break; }
            fi
            sleep 2
          done
          [ "$ok" = 1 ] || { echo "new-api /api/status did not answer success:true" >&2; exit 1; }
          {{- if .Values.proxy.enabled }}
          # newapi-proxy is Ready only when it reaches new-api and Valkey;
          # /readyz (admin port 8081) says so.
          ok=0
          for i in $(seq 1 30); do
            if out=$(wget -qO- http://{{ include "newapi.fullname" . }}-proxy:8081/readyz); then
              echo "$out" | grep -q '"ready":true' && { echo "proxy ready"; ok=1; break; }
            fi
            sleep 2
          done
          [ "$ok" = 1 ] || { echo "newapi-proxy /readyz did not answer ready:true" >&2; exit 1; }
          # The proxy port has no unauthenticated path: an unsigned request is 401.
          if out=$(wget -S -qO- http://{{ include "newapi.fullname" . }}-proxy:8080/api/status 2>&1); then
            echo "newapi-proxy answered an unsigned request" >&2; exit 1
          fi
          echo "$out" | grep -q ' 401 ' || { echo "unsigned request was not refused with 401" >&2; exit 1; }
          echo "proxy refuses unsigned requests"
          {{- end }}
      securityContext:
        {{- include "newapi.containerSecurity" . | nindent 8 }}
{{- end }}
