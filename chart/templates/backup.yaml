{{- if .Values.backup.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "newapi.fullname" . }}-backup
  labels:
    {{- include "newapi.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: {{ .Values.backup.storageClassName }}
  resources:
    requests:
      storage: {{ .Values.backup.size }}
---
# Daily pg_dump -Fc. The dump holds every API key and channel key in plain
# text (new-api stores them unencrypted): treat the PVC as secret material.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "newapi.fullname" . }}-pg-backup
  labels:
    {{- include "newapi.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  timeZone: Asia/Taipei
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            {{- include "newapi.labels" . | nindent 12 }}
            app.kubernetes.io/component: backup
        spec:
          restartPolicy: OnFailure
          automountServiceAccountToken: false
          enableServiceLinks: false
          {{- include "newapi.affinity" . | nindent 10 }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 70
            runAsGroup: 70
            fsGroup: 70
            {{- include "newapi.podSecurity" . | nindent 12 }}
          containers:
            - name: pg-dump
              image: {{ include "newapi.image" .Values.postgres.image }}
              imagePullPolicy: IfNotPresent
              env:
                - name: PGHOST
                  value: {{ include "newapi.fullname" . }}-postgres
                - name: PGUSER
                  value: newapi
                - name: PGDATABASE
                  value: newapi
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "newapi.secretName" . }}
                      key: POSTGRES_PASSWORD
                - name: TZ
                  value: Asia/Taipei
                - name: KEEP_DAYS
                  value: {{ .Values.backup.keepDays | quote }}
              command:
                - sh
                - -c
                - |
                  set -eu
                  # New pods can see REJECTs for 20-30 s while NetworkPolicy
                  # rules are programmed; wait up to 60 s, then fail loudly.
                  i=0
                  until pg_isready -q; do
                    i=$((i+1))
                    [ "$i" -ge 60 ] && { echo "postgres unreachable after 60 s" >&2; exit 1; }
                    sleep 1
                  done
                  f="/backups/newapi-$(date +%Y%m%dT%H%M%S%z).dump"
                  pg_dump -Fc -f "$f.part"
                  pg_restore -l "$f.part" > /dev/null
                  mv "$f.part" "$f"
                  echo "wrote $f ($(wc -c < "$f") bytes)"
                  find /backups -name 'newapi-*.dump' -mtime "+$KEEP_DAYS" -print -delete
                  find /backups -name '*.part' -mmin +120 -print -delete
              securityContext:
                {{- include "newapi.containerSecurity" . | nindent 16 }}
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
              volumeMounts:
                - name: backups
                  mountPath: /backups
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: {{ include "newapi.fullname" . }}-backup
            - name: tmp
              emptyDir: {}
{{- end }}
