{{- /*
newapi-proxy: the only in-cluster path from the PaaS Odoo pods to new-api
(code: woow_paas_platform extra/newapi-proxy; AI-models design §1.4, ticket
LLM-01a). It verifies Odoo's HMAC signature, whitelists and canonicalises
every request, injects the AP/OP service-account PATs it alone holds and
overwrites X-Forwarded-For with a synthetic per-tenant IP. Replay records are
shared by all replicas in the release's Valkey (ACL user newapi-proxy, see
templates/valkey.yaml).
*/ -}}
{{- if not (kindIs "bool" .Values.proxy.enabled) }}
{{- fail "proxy.enabled must be a boolean (dormant means false, not a string)" }}
{{- end }}
{{- if .Values.proxy.enabled }}
{{- if or (not (regexMatch "^[1-9][0-9]*$" (toString .Values.proxy.replicas))) (lt (int64 .Values.proxy.replicas) 1) (gt (int64 .Values.proxy.replicas) 2147483647) }}
{{- fail "proxy.replicas must be a positive integer; use proxy.enabled=false for dormant preparation" }}
{{- end }}
{{- $fn := include "newapi.fullname" . -}}
{{- $p := .Values.proxy -}}
{{- $img := $p.image -}}
{{- $digest := default "" $img.digest -}}
{{- if not (regexMatch "^sha256:[0-9a-f]{64}$" $digest) }}
{{- fail "proxy.image.digest must be sha256:<64 hex> (the digest build-newapi-proxy printed)" }}
{{- end }}
{{- if regexMatch "^sha256:0{64}$" $digest }}
{{- fail "proxy.image.digest is the all-zero placeholder: dispatch build-newapi-proxy and pin the digest it printed" }}
{{- end }}
{{- if and $img.tag (not (regexMatch "^[0-9a-f]{40}$" $img.tag)) }}
{{- fail "proxy.image.tag must be empty or the 40-hex commit sha (never latest)" }}
{{- end }}
{{- if not $p.clients }}
{{- fail "proxy.clients must list the Odoo pods allowed to call the proxy" }}
{{- end }}
{{- range $p.clients }}
{{- if not .name }}
{{- fail "each proxy.clients entry needs a name" }}
{{- end }}
{{- $ns := default dict .namespaceSelector }}
{{- $pod := default dict .podSelector }}
{{- /* An empty selector ({} or {matchLabels: {}}) means "every namespace /
every pod": refuse it, never a whole namespace or the whole cluster. */}}
{{- if not (or $ns.matchLabels $ns.matchExpressions) }}
{{- fail (printf "proxy.clients %s: namespaceSelector needs non-empty matchLabels or matchExpressions" .name) }}
{{- end }}
{{- if not (or $pod.matchLabels $pod.matchExpressions) }}
{{- fail (printf "proxy.clients %s: podSelector needs non-empty matchLabels or matchExpressions" .name) }}
{{- end }}
{{- /* ...and it must pin the pod's role: app.kubernetes.io/component as a
matchLabels value or a matchExpressions "In" with values. */}}
{{- $component := false }}
{{- if and $pod.matchLabels (index $pod.matchLabels "app.kubernetes.io/component") }}
{{- $component = true }}
{{- end }}
{{- range $pod.matchExpressions }}
{{- if and (eq .key "app.kubernetes.io/component") (eq .operator "In") .values }}
{{- $component = true }}
{{- end }}
{{- end }}
{{- if not $component }}
{{- fail (printf "proxy.clients %s: podSelector must select app.kubernetes.io/component (matchLabels, or matchExpressions In)" .name) }}
{{- end }}
{{- end }}
{{- if not (and $p.patsSecret $p.hmacSecret) }}
{{- fail "proxy.patsSecret and proxy.hmacSecret are required" }}
{{- end }}
{{- /* Same rule as the proxy (settings.py _USERNAME_RE_SHAPE): a literal "w" +
lowercase letter prefix, then only [a-z0-9], [a-z0-9-] classes, \d and {n,m}
counts — no ".", "*", "+", "?", "|", groups or other escapes. */}}
{{- if not (regexMatch "^\\^w[a-z](?:[a-z0-9]|\\[[a-z0-9-]+\\]|\\\\d|\\{[0-9]{1,3}(?:,[0-9]{1,3})?\\})*\\$$" (default "" $p.usernameRegex)) }}
{{- fail "proxy.usernameRegex must be ^w<lowercase letter> then only [a-z0-9], [a-z0-9-] classes, \\d and {n,m}, ending in $" }}
{{- end }}
{{- $until := include "newapi.proxyEpoch" $p.breakGlassUntil }}
{{- if $until }}
{{- if not (regexMatch "^[0-9]{1,12}$" $until) }}
{{- fail "proxy.breakGlassUntil must be unix seconds" }}
{{- end }}
{{- if gt (atoi $until) (add (now | unixEpoch) 86400) }}
{{- fail "proxy.breakGlassUntil may be at most 24 hours ahead" }}
{{- end }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $fn }}-proxy
  labels:
    {{- include "newapi.labels" . | nindent 4 }}
    app.kubernetes.io/component: proxy
data:
  PROXY_UPSTREAM_URL: "http://{{ $fn }}:3000"
  PROXY_USERNAME_REGEX: {{ $p.usernameRegex | quote }}
  PROXY_TENANT_IP_RANGE: {{ $p.tenantIpRange | quote }}
  PROXY_ADD_QUOTA_HOURLY_CAP_POINTS: {{ $p.addQuotaHourlyCapPoints | int64 | toString | quote }}
  PROXY_REPLICAS: {{ $p.replicas | int | toString | quote }}
  PROXY_INFLIGHT_USER: {{ $p.inflight.user | int | toString | quote }}
  PROXY_INFLIGHT_AP: {{ $p.inflight.ap | int | toString | quote }}
  PROXY_INFLIGHT_OP: {{ $p.inflight.op | int | toString | quote }}
  PROXY_INFLIGHT_ANON: {{ $p.inflight.anon | int | toString | quote }}
  PROXY_INFLIGHT_BG: {{ $p.inflight.bg | int | toString | quote }}
  PROXY_FREE_MODELS: {{ $p.freeModels | quote }}
  PROXY_AP_EXPIRES_AT: {{ include "newapi.proxyEpoch" $p.apExpiresAt | quote }}
  PROXY_OP_EXPIRES_AT: {{ include "newapi.proxyEpoch" $p.opExpiresAt | quote }}
  PROXY_BREAK_GLASS_UNTIL: {{ $until | quote }}
  PROXY_DEFAULT_READ_TIMEOUT: {{ $p.defaultReadTimeout | int | toString | quote }}
  PROXY_MAX_CONNECTIONS: {{ $p.maxConnections | int | toString | quote }}
  PROXY_LOG_LEVEL: {{ $p.logLevel | quote }}
  PROXY_PORT: "8080"
  PROXY_ADMIN_PORT: "8081"
  # Shared replay record: SET NX EX under newapi-proxy:replay:* as the ACL
  # user created in templates/valkey.yaml.
  PROXY_VALKEY_ADDR: "{{ $fn }}-valkey:6379"
  PROXY_VALKEY_USER: newapi-proxy
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fn }}-proxy
  labels:
    {{- include "newapi.labels" . | nindent 4 }}
    app.kubernetes.io/component: proxy
spec:
  type: ClusterIP
  selector:
    {{- include "newapi.selector" (list . "proxy") | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
    # /healthz, /readyz, /metrics (NetworkPolicy: the same clients + helm test)
    - name: admin
      port: 8081
      targetPort: admin
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fn }}-proxy
  labels:
    {{- include "newapi.labels" . | nindent 4 }}
    app.kubernetes.io/component: proxy
spec:
  replicas: {{ $p.replicas | int }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Readiness = upstream and Valkey reachable, so a new pod only takes
      # traffic once it can actually serve; never drop below current capacity.
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "newapi.selector" (list . "proxy") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "newapi.labels" . | nindent 8 }}
        app.kubernetes.io/component: proxy
      annotations:
        checksum/config: {{ toYaml $p | sha256sum }}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      # preStop 5 s + the proxy's graceful shutdown (40 s: the longest request
      # is 30 s) + margin; in-flight reveal / add_quota calls finish.
      terminationGracePeriodSeconds: 60
      {{- with $p.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- include "newapi.affinity" . | nindent 6 }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "newapi.selector" (list . "proxy") | nindent 14 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        {{- include "newapi.podSecurity" . | nindent 8 }}
      containers:
        - name: proxy
          image: "{{ $img.repository }}{{ if $img.tag }}:{{ $img.tag }}{{ end }}@{{ $img.digest }}"
          imagePullPolicy: {{ $img.pullPolicy }}
          envFrom:
            - configMapRef:
                name: {{ $fn }}-proxy
          env:
            # Values never live in git or values files: these Secrets are
            # created with kubectl create/replace from stdin (docs/OPERATIONS.md).
            # The pod does not notice a changed Secret: restart it
            # (kubectl rollout restart deploy/<release>-proxy).
            - name: PROXY_AP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $p.patsSecret }}
                  key: ap
            - name: PROXY_OP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $p.patsSecret }}
                  key: op
            - name: PROXY_AUTH_WEB
              valueFrom:
                secretKeyRef:
                  name: {{ $p.hmacSecret }}
                  key: web
            - name: PROXY_AUTH_CRON
              valueFrom:
                secretKeyRef:
                  name: {{ $p.hmacSecret }}
                  key: cron
            # Generated by the chart (templates/secret.yaml), kept forever.
            - name: PROXY_VALKEY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "newapi.secretName" . }}
                  key: PROXY_VALKEY_PASSWORD
          ports:
            - name: http
              containerPort: 8080
            - name: admin
              containerPort: 8081
          # Both probes use the admin listener: its own connection limit, so a
          # saturated proxy port cannot fail them. /readyz answers 200 only when
          # new-api's /api/status and Valkey answer (k3s NetworkPolicy takes a
          # few seconds to admit a new pod); the check is cached and runs at most
          # once at a time, worst case ~3 s < timeoutSeconds.
          readinessProbe:
            httpGet:
              path: /readyz
              port: admin
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: admin
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          lifecycle:
            preStop:
              exec:
                # Keep serving while the endpoint is removed from the Service.
                command: ["sleep", "5"]
          securityContext:
            {{- include "newapi.containerSecurity" . | nindent 12 }}
          resources:
            {{- toYaml $p.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $fn }}-proxy
  labels:
    {{- include "newapi.labels" . | nindent 4 }}
    app.kubernetes.io/component: proxy
spec:
  minAvailable: 1
  selector:
    matchLabels:
      {{- include "newapi.selector" (list . "proxy") | nindent 6 }}
---
# In: only the listed Odoo pods (namespace AND pod selector, never a whole
# namespace) and the helm test pod, on 8080 (signed proxy) and 8081 (health
# for PaaS's own checks; kubelet probes are not subject to NetworkPolicy).
# Out: new-api 3000, Valkey 6379 (replay record; DNS comes from the
# release-wide allow-dns policy) plus a mirror of the ingress sources on the
# Linux ephemeral port range only: k3s' embedded enforcer treats some reply
# packets as fresh egress, and those go back to the client's source port.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fn }}-proxy
  labels:
    {{- include "newapi.labels" . | nindent 4 }}
    app.kubernetes.io/component: proxy
spec:
  podSelector:
    matchLabels:
      {{- include "newapi.selector" (list . "proxy") | nindent 6 }}
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        {{- range $p.clients }}
        # {{ .name }}
        - namespaceSelector:
            {{- toYaml .namespaceSelector | nindent 12 }}
          podSelector:
            {{- toYaml .podSelector | nindent 12 }}
        {{- end }}
        - podSelector:
            matchLabels:
              {{- include "newapi.selector" (list . "test") | nindent 14 }}
      ports:
        - { protocol: TCP, port: 8080 }
        - { protocol: TCP, port: 8081 }
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
              newapi.woowtech.io/serves-relay: "true"
      ports:
        - { protocol: TCP, port: 3000 }
    - to:
        - podSelector:
            matchLabels:
              {{- include "newapi.selector" (list . "valkey") | nindent 14 }}
      ports:
        - { protocol: TCP, port: 6379 }
    - to:
        {{- range $p.clients }}
        - namespaceSelector:
            {{- toYaml .namespaceSelector | nindent 12 }}
          podSelector:
            {{- toYaml .podSelector | nindent 12 }}
        {{- end }}
        - podSelector:
            matchLabels:
              {{- include "newapi.selector" (list . "test") | nindent 14 }}
      ports:
        - { protocol: TCP, port: 32768, endPort: 60999 }
{{- end }}
