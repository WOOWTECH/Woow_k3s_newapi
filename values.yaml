# Default values for the newapi chart.
# Defaults reproduce the original Kustomize deployment's shape 1:1 (namespace
# new-api, NodePort 30300 for HTTP, local-path storage) EXCEPT for secrets:
# secrets.create now defaults to false (see below), so a fresh install needs
# either secrets.create=true with real values, or a pre-created Secret
# `new-api-secret` (see examples/secrets.example.yaml).

namespace:
  # Create the target namespace as part of the release.
  # Set to false if the namespace is managed elsewhere.
  # Never rendered when it equals the release namespace (-n): Helm keeps its
  # release record there, so it is created with --create-namespace instead
  # and can never be deleted by `helm uninstall`.
  create: true
  # Original Kustomize namespace was `new-api`; preserved for resource
  # equivalence. The chart/product name is `newapi` (no hyphen).
  # EMPTY BY DEFAULT so `-n` controls placement. A non-empty value here
  # silently overrides `-n`, which is how a rehearsal once wrote Helm
  # ownership annotations onto a live production Deployment.
  name: ""

# Add `helm.sh/resource-policy: keep` to the Namespace, both PVCs and the
# chart-created Secret, so `helm uninstall` never deletes new-api's uploads,
# the Postgres database or Redis's AOF file.
keepOnUninstall: true

newapi:
  image:
    repository: calciumion/new-api
    tag: latest
    # "Always" matches the original manifests' behaviour with the
    # :latest tag (Kubernetes defaults to Always for :latest tags).
    pullPolicy: Always

  service:
    type: NodePort
    port: 3000
    # Only used when type is NodePort.
    nodePort: 30300

  persistence:
    # PVC for new-api application data (uploads, cache).
    storageClassName: local-path
    size: 5Gi

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi

postgres:
  image:
    repository: postgres
    tag: 16-alpine
    # Explicit; matches implicit default for pinned tags.
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 5432

  persistence:
    # StatefulSet volumeClaimTemplates size.
    storageClassName: local-path
    size: 10Gi

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

redis:
  image:
    repository: redis
    tag: 7-alpine
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 6379

  persistence:
    # PVC for Redis append-only file.
    storageClassName: local-path
    size: 2Gi

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

config:
  # ConfigMap keys applied to postgres via envFrom and to new-api / redis
  # via individual env references. Names/values match the original ConfigMap.
  TZ: "Asia/Taipei"
  POSTGRES_USER: "newapi"
  POSTGRES_DB: "newapi"

secrets:
  # false (default): the Secret `new-api-secret` already exists (created from
  #   examples/secrets.example.yaml) and the chart never renders it, so a
  #   `helm upgrade` can never overwrite a real password with an empty value.
  # true: render the Secret from the values below (fresh installs, tests).
  #   Every key below is required() when create=true - no weak default
  #   password ships in this file.
  create: false
  # PostgreSQL superuser password. Letters, digits only recommended
  # (generate with `openssl rand -hex 24`): a `/` from `openssl rand -base64`
  # breaks SQL_DSN's postgres:// URL parsing about 4 times in 10.
  postgresPassword: ""
  # SQL_DSN and REDIS_CONN_STRING are NOT set here: the chart computes them
  # from postgresPassword and config.POSTGRES_USER/POSTGRES_DB (Redis has no
  # password), so there is only one password to keep in sync, not two.

tests:
  # `helm test` smoke pod: /api/status (readiness) and Postgres tables. Read-only.
  enabled: true
