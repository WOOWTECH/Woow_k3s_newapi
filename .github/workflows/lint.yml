name: chart

on:
  push:
  pull_request:
  workflow_dispatch: {}

env:
  # Dummy value only: exercises templates/secret.yaml without any real password.
  SECRETS: secrets.create=true,secrets.postgresPassword=x
  KUBECONFORM_VERSION: v0.6.7
  KUBECONFORM_SHA256: 95f14e87aa28c09d5941f11bd024c1d02fdc0303ccaa23f61cef67bc92619d73

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.19.5

      - name: helm lint
        run: |
          helm lint .
          helm lint . --set "$SECRETS"

      - name: helm template (every values combination)
        run: |
          mkdir -p /tmp/r
          helm template newapi . -n new-api                                    > /tmp/r/default.yaml
          helm template newapi .                                               > /tmp/r/default-ns.yaml
          helm template newapi . -n new-api --set "$SECRETS"                   > /tmp/r/secrets.yaml
          helm template newapi . -n new-api --set "$SECRETS" --set keepOnUninstall=false > /tmp/r/no-keep.yaml
          helm template newapi . -n new-api --set namespace.create=false       > /tmp/r/no-ns.yaml
          # The shape of a test install: own namespace, disposable storage, no NodePort.
          helm template newapi . -n ht-newapi \
            --set namespace.name=ht-newapi,newapi.persistence.storageClassName=longhorn-delete \
            --set postgres.persistence.storageClassName=longhorn-delete,redis.persistence.storageClassName=longhorn-delete \
            --set newapi.service.type=ClusterIP --set "$SECRETS"               > /tmp/r/test-install.yaml
          wc -l /tmp/r/*.yaml

      - name: Every template is tracked and renders
        run: |
          # An unanchored .gitignore pattern once could keep templates/secret.yaml out of git.
          for f in $(find templates -type f); do
            if git check-ignore --no-index -q "$f"; then echo "::error::$f is matched by .gitignore"; exit 1; fi
          done
          for f in $(find templates -type f -name '*.yaml'); do
            grep -q "^# Source: newapi/$f\$" /tmp/r/*.yaml || { echo "::error::$f never renders"; exit 1; }
          done
          echo "every template is tracked and renders"

      - name: kubeconform (schema validation)
        run: |
          curl -sSLo /tmp/kc.tgz https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz
          echo "${KUBECONFORM_SHA256}  /tmp/kc.tgz" | sha256sum -c -
          tar -xzf /tmp/kc.tgz -C /usr/local/bin kubeconform
          kubeconform -strict -summary /tmp/r/*.yaml

      - name: Required secrets are enforced
        run: |
          if helm template newapi . --set secrets.create=true > /dev/null 2>&1; then
            echo "secrets.create=true rendered without secrets.postgresPassword"; exit 1
          fi
          out=$(helm template newapi . --set secrets.create=true 2>&1) || true
          echo "$out" | grep -q "secrets.postgresPassword is required" || { echo "::error::wrong error: $out"; exit 1; }
          echo "required() guard fires"
          # The Secret must render with all 3 keys when secrets.create=true.
          n=$(grep -c '^kind: Secret$' /tmp/r/secrets.yaml || true)
          [ "$n" -eq 1 ] || { echo "expected 1 Secret with secrets.create=true, got $n"; exit 1; }
          for k in POSTGRES_PASSWORD SQL_DSN REDIS_CONN_STRING; do
            grep -q "^  $k:" /tmp/r/secrets.yaml || { echo "::error::$k missing from rendered Secret"; exit 1; }
          done
          echo "secrets.create=true renders a complete Secret"

      - name: Keep policy on the Namespace, PVCs and Secret
        run: |
          python3 - <<'EOF'
          import sys, yaml
          bad = []
          def objs(f): return [d for d in yaml.safe_load_all(open(f)) if d]
          for d in objs("/tmp/r/secrets.yaml") + objs("/tmp/r/default-ns.yaml"):
              if d["kind"] in ("Namespace", "PersistentVolumeClaim", "Secret"):
                  if (d["metadata"].get("annotations") or {}).get("helm.sh/resource-policy") != "keep":
                      bad.append(f"{d['kind']}/{d['metadata']['name']} has no keep policy")
          for d in objs("/tmp/r/default.yaml"):
              if d["kind"] == "Namespace" and d["metadata"]["name"] == "new-api":
                  bad.append("the release namespace must never be rendered")
          for d in objs("/tmp/r/no-keep.yaml"):
              if d["kind"] in ("Namespace", "PersistentVolumeClaim", "Secret"):
                  if "helm.sh/resource-policy" in (d["metadata"].get("annotations") or {}):
                      bad.append(f"{d['kind']}/{d['metadata']['name']} kept despite keepOnUninstall=false")
          sys.exit("\n".join(bad)) if bad else print("keep policy present; release namespace not rendered")
          EOF

      - name: No real secret committed
        run: |
          python3 - <<'EOF'
          import glob, sys, yaml
          bad = []
          s = yaml.safe_load(open("values.yaml"))["secrets"]
          for k, v in s.items():
              if k != "create" and v:
                  bad.append(f"values.yaml secrets.{k} must be empty")
          for f in ("/tmp/r/default.yaml", "/tmp/r/default-ns.yaml"):
              for d in yaml.safe_load_all(open(f)):
                  if d and d["kind"] == "Secret":
                      bad.append(f"{f} must not contain a Secret (secrets.create=false)")
          for d in yaml.safe_load_all(open("examples/secrets.example.yaml")):
              for k, v in ((d or {}).get("stringData") or {}).items():
                  if "REPLACE_ME" not in str(v) and v != "redis://redis:6379":
                      bad.append(f"examples: {d['metadata']['name']}.{k} is not a placeholder")
          sys.exit("\n".join(bad)) if bad else print("no secrets committed")
          EOF

      - name: Shell scripts parse
        run: bash -n scripts/*.sh

      - name: "-n controls object placement (namespace footgun)"
        run: |
          # A values-file `namespace.name` that silently beats `-n` is how a
          # rehearsal once wrote Helm ownership annotations onto a live
          # production Deployment. Every object must land in the namespace
          # given by -n when namespace.name is left at its empty default.
          got=$(helm template t . -n SENTINEL --skip-tests  | grep "^  namespace:" | sort -u)
          if [ "$got" != "  namespace: SENTINEL" ]; then
            echo "::error::. ignores -n: $got"; exit 1
          fi
          echo "-n controls placement for every chart"

      - name: namespace.name must default to empty
        run: |
          python3 - <<'EOF'
          import sys, yaml, glob
          bad = []
          for f in glob.glob("**/values.yaml", recursive=True):
              v = yaml.safe_load(open(f)) or {}
              n = (v.get("namespace") or {})
              if isinstance(n, dict) and n.get("name"):
                  bad.append(f"{f}: namespace.name defaults to {n['name']!r}; it must be \"\" so -n wins")
          sys.exit("\n".join(bad)) if bad else print("namespace.name defaults are empty")
          EOF
